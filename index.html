<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnitSwap - Unit Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="top">
      <h1>Unit<span>Swap</span></h1>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="row">
      <div class="field">
        <label for="fromValue">From</label>
        <input type="number" id="fromValue" value="1" />
        <select id="fromUnit"></select>
      </div>

      <button id="swapBtn" class="swap" aria-label="Swap units">⇄</button>

      <div class="field">
        <label for="toValue">To</label>
        <input type="text" id="toValue" readonly />
        <select id="toUnit"></select>
      </div>
    </div>

    <div class="result">
      <p id="resultText"></p>
      <button id="copyBtn" class="copy">Copy result</button>
    </div>
  </main>

  <footer>Built by Vishal Kumar Prajapati</footer>
  <script src="script.js"></script>
</body>
</html>
